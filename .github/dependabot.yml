version: 2
updates:
  - package-ecosystem: 'npm'
    directories:
      - '/packages/n8n-nodes-anaf-ro'
      - '/packages/n8n-nodes-smartbill'
      - '/packages/n8n-nodes-oblio'
    schedule:
      interval: 'weekly'
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
